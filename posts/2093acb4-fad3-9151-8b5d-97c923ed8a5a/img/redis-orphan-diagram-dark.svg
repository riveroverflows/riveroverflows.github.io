<svg viewBox="0 0 960 530" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; }
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#4ecca3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="agd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#3a9e80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#e74c3c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ard" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#b04040" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="960" height="530" fill="#1a1a2e" rx="12"/>

  <text x="480" y="33" text-anchor="middle" fill="#c8c8d8" font-size="15" font-weight="600">ZPOPMIN + 토큰 발급 분리 시 서버 크래시 시나리오</text>

  <line x1="480" y1="52" x2="480" y2="515" stroke="#2e2e4a" stroke-width="1" stroke-dasharray="5 4"/>


  <!-- ===== 시나리오 1: 정상 흐름 ===== -->
  <text x="245" y="68" text-anchor="middle" fill="#4ecca3" font-size="13" font-weight="600">시나리오 1 — 정상 흐름</text>

  <rect x="75" y="85" width="130" height="36" rx="6" fill="#16213e" stroke="#4ecca3" stroke-width="1.2"/>
  <text x="140" y="108" text-anchor="middle" fill="#d0e8e0" font-size="13" font-weight="500">Server</text>

  <rect x="285" y="85" width="130" height="36" rx="6" fill="#16213e" stroke="#4ecca3" stroke-width="1.2"/>
  <text x="350" y="108" text-anchor="middle" fill="#d0e8e0" font-size="13" font-weight="500">Redis</text>

  <line x1="140" y1="121" x2="140" y2="395" stroke="#4ecca3" stroke-width="0.7" stroke-dasharray="4 3" opacity="0.3"/>
  <line x1="350" y1="121" x2="350" y2="395" stroke="#4ecca3" stroke-width="0.7" stroke-dasharray="4 3" opacity="0.3"/>

  <rect x="136" y="148" width="8" height="170" rx="3" fill="#4ecca3" opacity="0.1"/>
  <rect x="346" y="148" width="8" height="170" rx="3" fill="#4ecca3" opacity="0.1"/>

  <!-- Step 1 -->
  <text x="245" y="152" text-anchor="middle" fill="#70c0a0" font-size="11" font-weight="500">① ZPOPMIN</text>
  <line x1="148" y1="162" x2="342" y2="162" stroke="#4ecca3" stroke-width="1.2" marker-end="url(#ag)"/>
  <text x="245" y="195" text-anchor="middle" fill="#508878" font-size="10.5">유저를 대기열에서 제거 후 반환</text>
  <line x1="342" y1="205" x2="148" y2="205" stroke="#3a9e80" stroke-width="0.9" stroke-dasharray="5 3" marker-end="url(#agd)"/>

  <!-- Step 2 -->
  <text x="245" y="248" text-anchor="middle" fill="#70c0a0" font-size="11" font-weight="500">② SET EX 300 (토큰 발급)</text>
  <line x1="148" y1="258" x2="342" y2="258" stroke="#4ecca3" stroke-width="1.2" marker-end="url(#ag)"/>
  <text x="245" y="291" text-anchor="middle" fill="#508878" font-size="10.5">토큰 저장 완료</text>
  <line x1="342" y1="301" x2="148" y2="301" stroke="#3a9e80" stroke-width="0.9" stroke-dasharray="5 3" marker-end="url(#agd)"/>

  <!-- Check mark -->
  <circle cx="245" y="345" r="14" fill="none" stroke="#4ecca3" stroke-width="1.2" cy="358"/>
  <path d="M237 358L243 364L254 352" fill="none" stroke="#4ecca3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Final state -->
  <rect x="60" y="400" width="370" height="84" rx="8" fill="#0d2216" stroke="#4ecca3" stroke-width="0.8" opacity="0.9"/>
  <text x="245" y="424" text-anchor="middle" fill="#4ecca3" font-size="12" font-weight="600">최종 상태</text>
  <line x1="160" y1="432" x2="330" y2="432" stroke="#4ecca3" stroke-width="0.3" opacity="0.5"/>
  <text x="245" y="452" text-anchor="middle" fill="#70a890" font-size="11">대기열: ✗ 제거됨   ·   토큰: ✓ 발급됨</text>
  <text x="245" y="474" text-anchor="middle" fill="#4ecca3" font-size="13" font-weight="600">정상 처리 완료</text>


  <!-- ===== 시나리오 2: 크래시 흐름 ===== -->
  <text x="715" y="68" text-anchor="middle" fill="#e74c3c" font-size="13" font-weight="600">시나리오 2 — 크래시 흐름</text>

  <rect x="555" y="85" width="130" height="36" rx="6" fill="#16213e" stroke="#e74c3c" stroke-width="1.2"/>
  <text x="620" y="108" text-anchor="middle" fill="#e0d0d0" font-size="13" font-weight="500">Server</text>

  <rect x="765" y="85" width="130" height="36" rx="6" fill="#16213e" stroke="#e74c3c" stroke-width="1.2"/>
  <text x="830" y="108" text-anchor="middle" fill="#e0d0d0" font-size="13" font-weight="500">Redis</text>

  <line x1="620" y1="121" x2="620" y2="240" stroke="#e74c3c" stroke-width="0.7" stroke-dasharray="4 3" opacity="0.3"/>
  <line x1="830" y1="121" x2="830" y2="395" stroke="#e74c3c" stroke-width="0.7" stroke-dasharray="4 3" opacity="0.3"/>

  <rect x="616" y="148" width="8" height="70" rx="3" fill="#e74c3c" opacity="0.1"/>
  <rect x="826" y="148" width="8" height="70" rx="3" fill="#e74c3c" opacity="0.1"/>

  <!-- Step 1 (same) -->
  <text x="725" y="152" text-anchor="middle" fill="#d08080" font-size="11" font-weight="500">① ZPOPMIN</text>
  <line x1="628" y1="162" x2="822" y2="162" stroke="#e74c3c" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="725" y="195" text-anchor="middle" fill="#906060" font-size="10.5">유저를 대기열에서 제거 후 반환</text>
  <line x1="822" y1="205" x2="628" y2="205" stroke="#b04040" stroke-width="0.9" stroke-dasharray="5 3" marker-end="url(#ard)"/>

  <!-- Crash zone highlight -->
  <rect x="570" y="238" width="100" height="92" rx="6" fill="#ff4757" opacity="0.06"/>

  <!-- Crash X -->
  <line x1="602" y1="258" x2="638" y2="294" stroke="#ff4757" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="638" y1="258" x2="602" y2="294" stroke="#ff4757" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Crash label -->
  <rect x="565" y="305" width="110" height="26" rx="4" fill="#3a1218" stroke="#ff4757" stroke-width="1"/>
  <text x="620" y="322" text-anchor="middle" fill="#ff6b6b" font-size="11.5" font-weight="600">서버 크래시!</text>

  <!-- Annotation -->
  <text x="690" y="348" fill="#c06060" font-size="10" opacity="0.8">② SET EX 300 실행 불가</text>
  <text x="690" y="363" fill="#906060" font-size="10" opacity="0.7">(토큰이 발급되지 않음)</text>

  <!-- Warning icon -->
  <path d="M715 375L722.5 388L707.5 388Z" fill="none" stroke="#ff4757" stroke-width="1.2" stroke-linejoin="round"/>
  <text x="715" y="386.5" text-anchor="middle" fill="#ff4757" font-size="9" font-weight="700">!</text>

  <!-- Final state -->
  <rect x="535" y="400" width="370" height="84" rx="8" fill="#2a0e0e" stroke="#e74c3c" stroke-width="0.8" opacity="0.9"/>
  <text x="720" y="424" text-anchor="middle" fill="#e74c3c" font-size="12" font-weight="600">최종 상태</text>
  <line x1="620" y1="432" x2="820" y2="432" stroke="#e74c3c" stroke-width="0.3" opacity="0.5"/>
  <text x="720" y="452" text-anchor="middle" fill="#c07070" font-size="11">대기열: ✗ 제거됨   ·   토큰: ✗ 미발급</text>
  <text x="720" y="474" text-anchor="middle" fill="#ff4757" font-size="13" font-weight="600">미아(orphan) 유저 발생!</text>
</svg>
